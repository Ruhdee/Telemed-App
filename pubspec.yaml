name: telemed_app
description: "TeleMedCare - Premium Healthcare Flutter App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Routing
  go_router: ^15.1.2

  # State Management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.8.0+1
  socket_io_client: ^3.0.2

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # AI
  google_generative_ai: ^0.4.6

  # UI & Icons
  lucide_icons: ^0.257.0
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1

  # Storage
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.4.0

  # Media
  flutter_webrtc: ^0.12.8+hotfix.1
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  video_player: ^2.9.3
  permission_handler: ^12.0.0+1

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.1
  geolocator: ^14.0.0
  http: ^1.4.0
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
